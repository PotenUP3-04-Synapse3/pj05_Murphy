<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Murphy Respond Dialog</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2428;
      --muted: #5f6b62;
      --line: #d8ded7;
      --surface: #ffffff;
      --surface-soft: #f5f7f2;
      --blue: #1f6feb;
      --blue-dark: #174ea6;
      --green: #147c5d;
      --green-dark: #0f5e47;
      --red: #b42318;
      --amber: #a86100;
      --bubble-user: #1f6feb;
      --bubble-npc: #eef2f6;
      --focus: #2d6cdf;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--surface-soft);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      letter-spacing: 0;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .header-inner,
    main {
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 72px;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      color: var(--muted);
      background: var(--surface);
      white-space: nowrap;
    }

    .status-pill.running {
      border-color: #9fc7b5;
      color: var(--green);
    }

    .status-pill.error {
      border-color: #f0b9b4;
      color: var(--red);
    }

    .status-pill.warning {
      border-color: #e7c88e;
      color: var(--amber);
    }

    .running-stopwatch {
      display: none;
      position: relative;
      width: 14px;
      height: 14px;
      border: 2px solid currentColor;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .running-stopwatch::before {
      content: "";
      position: absolute;
      top: -5px;
      left: 50%;
      width: 6px;
      height: 3px;
      border-radius: 3px;
      background: currentColor;
      transform: translateX(-50%);
    }

    .running-stopwatch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 50%;
      width: 2px;
      height: 5px;
      border-radius: 2px;
      background: currentColor;
      transform: translateX(-50%) rotate(35deg);
      transform-origin: 50% 100%;
    }

    .status-pill.running .running-stopwatch {
      display: inline-block;
    }

    main {
      display: grid;
      grid-template-columns: minmax(320px, 430px) minmax(0, 1fr);
      gap: 20px;
      padding: 20px 0 32px;
    }

    section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 16px;
    }

    .left-rail,
    .right-rail {
      display: grid;
      gap: 16px;
      align-content: start;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 700;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input[type="file"],
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }

    input[type="file"] {
      padding: 9px;
    }

    textarea {
      min-height: 360px;
      resize: vertical;
      padding: 10px;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.4;
    }

    button {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 6px;
      min-height: 40px;
      padding: 0 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:focus,
    input:focus,
    textarea:focus {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    button.primary {
      width: 100%;
      margin-top: 14px;
      background: var(--green);
      color: #fff;
    }

    button.primary:hover {
      background: var(--green-dark);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    button.primary:disabled,
    button.primary:disabled:hover {
      background: #7aa895;
    }

    button.secondary,
    button.chapter,
    button.play {
      background: #eef3eb;
      border-color: var(--line);
      color: var(--ink);
    }

    button.secondary:disabled,
    button.chapter:disabled,
    button.play:disabled {
      background: #f2f4f0;
      color: #7a837b;
    }

    button.chapter.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    button.play {
      min-height: 32px;
      margin-top: 8px;
      padding: 0 10px;
      font-size: 13px;
    }

    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chapter-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .payload-details {
      margin-top: 12px;
    }

    .payload-details summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .record-panel {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .record-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .record-actions button {
      min-width: 0;
    }

    #quickUseRecordingButton {
      grid-column: 1 / -1;
    }

    .recording-meta {
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .realtime-subtitle-panel {
      display: grid;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
      padding: 10px;
    }

    .realtime-subtitle-heading {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .realtime-subtitle-text {
      min-height: 54px;
      border-radius: 8px;
      background: #101828;
      color: #fff;
      padding: 10px;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .realtime-subtitle-text.final {
      background: #123f33;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      border-left: 3px solid var(--blue);
      background: #f7fafc;
      padding: 10px;
      min-height: 72px;
    }

    .metric strong {
      display: block;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
    }

    .metric span {
      display: block;
      margin-top: 6px;
      font-size: 17px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .dialog-shell {
      min-height: 560px;
      max-height: 720px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
      padding: 16px;
    }

    .transcript {
      display: grid;
      gap: 12px;
    }

    .message {
      display: grid;
      gap: 4px;
      max-width: min(78%, 620px);
    }

    .message.user {
      justify-self: end;
    }

    .message.npc {
      justify-self: start;
    }

    .speaker {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .message.user .speaker {
      text-align: right;
    }

    .bubble {
      border-radius: 18px;
      padding: 10px 13px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      box-shadow: 0 1px 2px rgba(31, 36, 40, 0.08);
    }

    .user .bubble {
      background: var(--bubble-user);
      color: #fff;
      border-bottom-right-radius: 6px;
    }

    .npc .bubble {
      background: var(--bubble-npc);
      color: var(--ink);
      border-bottom-left-radius: 6px;
    }

    .turn-divider {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      margin: 4px 0;
    }

    .turn-divider::before,
    .turn-divider::after {
      content: "";
      display: block;
      height: 1px;
      background: var(--line);
    }

    .divider-label {
      display: grid;
      gap: 2px;
    }

    .divider-label strong {
      color: var(--ink);
      font-size: 12px;
    }

    pre {
      margin: 8px 0 0;
      max-height: 260px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfa;
      padding: 10px;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .error {
      color: var(--red);
      font-weight: 700;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }

      .metric-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .message {
        max-width: 90%;
      }
    }

    @media (max-width: 560px) {
      .metric-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>Murphy Respond Dialog</h1>
      <div class="status-pill" id="runtimeStatus">
        <span class="running-stopwatch" id="runningStopwatch" aria-hidden="true"></span>
        <span id="runtimeStatusText">Idle</span>
      </div>
    </div>
  </header>

  <main>
    <div class="left-rail">
      <section>
        <h2>Chapters</h2>
        <div class="chapter-grid" id="chapterButtons">
          <button class="chapter active" type="button" data-chapter-id="CH0_01_FLIGHT_SMALLTALK">Flight</button>
          <button class="chapter" type="button" data-chapter-id="CH0_03_IMMIGRATION_CHECK">Immigration</button>
          <button class="chapter" type="button" data-chapter-id="CH0_04_BAGGAGE_CLAIM">Baggage</button>
          <button class="chapter" type="button" data-chapter-id="CH0_05_RESULT">Result</button>
        </div>
      </section>

      <section>
        <h2>Input</h2>
        <label for="audioFile">Upload WAV</label>
        <input id="audioFile" type="file" accept=".wav,audio/wav,audio/x-wav">

        <details class="payload-details">
          <summary>Generated Payload</summary>
          <textarea id="turnJson" spellcheck="false" readonly></textarea>
        </details>

        <div class="button-row">
          <button class="secondary" id="resetTurn" type="button">Reset Dialog</button>
        </div>
        <button class="primary" id="runButton" type="button">Send WAV</button>

        <label for="quickAudioFile">Recorded or Next WAV</label>
        <input id="quickAudioFile" type="file" accept=".wav,audio/wav,audio/x-wav">
        <div class="record-panel">
          <div class="record-actions">
            <button class="secondary" id="quickRecordButton" type="button">Record</button>
            <button class="secondary" id="quickStopRecordButton" type="button" disabled>Stop</button>
            <button class="secondary" id="quickUseRecordingButton" type="button" disabled>Send Recording</button>
          </div>
          <div class="recording-meta" id="quickRecordingStatus">No recording</div>
          <div class="realtime-subtitle-panel">
            <div class="realtime-subtitle-heading">
              <span>Realtime STT Subtitles</span>
              <span id="realtimeSubtitleStatus">Idle</span>
            </div>
            <div class="realtime-subtitle-text" id="realtimeSubtitleText">-</div>
            <div class="recording-meta" id="realtimeFinalTranscript">Final transcript: -</div>
          </div>
        </div>
        <button class="primary" id="continueButton" type="button">Continue</button>
      </section>
    </div>

    <div class="right-rail">
      <section>
        <h2>Timing</h2>
        <div class="metric-grid">
          <div class="metric">
            <strong>Total</strong>
            <span id="elapsedTotal">-</span>
          </div>
          <div class="metric">
            <strong>Status</strong>
            <span id="httpStatus">-</span>
          </div>
          <div class="metric">
            <strong>STT</strong>
            <span id="sttRuntime">-</span>
          </div>
          <div class="metric">
            <strong>Verdict</strong>
            <span id="verdict">-</span>
          </div>
        </div>
      </section>

      <section>
        <h2>Session Usage</h2>
        <div class="metric-grid">
          <div class="metric">
            <strong>Session</strong>
            <span id="sessionId">-</span>
          </div>
          <div class="metric">
            <strong>Tokens</strong>
            <span id="sessionTokens">0</span>
          </div>
          <div class="metric">
            <strong>Cost USD</strong>
            <span id="sessionCost">$0.000000</span>
          </div>
          <div class="metric">
            <strong>Turn</strong>
            <span id="turnIndex">1</span>
          </div>
        </div>
      </section>

      <section>
        <h2>Dialog</h2>
        <div class="dialog-shell" id="dialogShell">
          <div class="transcript" id="transcript"></div>
        </div>
      </section>

      <section>
        <h2>Raw Response</h2>
        <pre id="rawJson">-</pre>
      </section>
    </div>
  </main>

  <script>
    const firstNodeId = "FLIGHT_A_001_SEATMATE_SMALLTALK";
    const defaultChapterId = "CH0_01_FLIGHT_SMALLTALK";
    const chapterStarts = {
      CH0_01_FLIGHT_SMALLTALK: {
        nodeId: "FLIGHT_A_001_SEATMATE_SMALLTALK",
        sceneId: "AIRPLANE_CABIN",
        npcId: "arabella",
        npcRole: "seatmate",
        speaker: "Arabella",
        flags: ["in_flight", "arrival_form_started"],
        inventory: ["passport", "boarding_pass", "return_ticket"],
        completedIntents: [],
        objective: "Respond politely to the seatmate's request"
      },
      CH0_03_IMMIGRATION_CHECK: {
        nodeId: "IMM_001_PASSPORT",
        sceneId: "JFK_IMMIGRATION_HALL",
        npcId: "OFFICER_MILLER",
        npcRole: "immigration_officer",
        speaker: "Officer Miller",
        flags: ["arrived_at_jfk"],
        inventory: ["passport", "boarding_pass", "return_ticket"],
        completedIntents: [],
        objective: "Submit your passport"
      },
      CH0_04_BAGGAGE_CLAIM: {
        nodeId: "BAG_001_REPORT_MISSING_AT_DESK",
        sceneId: "JFK_BAGGAGE_CLAIM",
        npcId: "BAGGAGE_STAFF_01",
        npcRole: "baggage_service_staff",
        speaker: "Baggage Staff",
        flags: ["immigration_cleared", "at_baggage_claim"],
        inventory: ["passport", "boarding_pass", "baggage_claim_tag"],
        completedIntents: [],
        objective: "Report that your suitcase did not arrive"
      },
      CH0_05_RESULT: {
        nodeId: "ALPHA_999_FINAL_SCOREBOARD",
        sceneId: "ALPHA_RESULT",
        npcId: "RESULT_SCREEN",
        npcRole: "result_screen",
        speaker: "Result",
        flags: ["alpha_complete"],
        inventory: ["passport", "boarding_pass", "baggage_claim_tag"],
        completedIntents: [],
        objective: "Review the Alpha result"
      }
    };

    const refs = {
      audioFile: document.getElementById("audioFile"),
      turnJson: document.getElementById("turnJson"),
      chapterButtons: document.getElementById("chapterButtons"),
      resetTurn: document.getElementById("resetTurn"),
      runButton: document.getElementById("runButton"),
      quickAudioFile: document.getElementById("quickAudioFile"),
      quickRecordButton: document.getElementById("quickRecordButton"),
      quickStopRecordButton: document.getElementById("quickStopRecordButton"),
      quickUseRecordingButton: document.getElementById("quickUseRecordingButton"),
      quickRecordingStatus: document.getElementById("quickRecordingStatus"),
      realtimeSubtitleStatus: document.getElementById("realtimeSubtitleStatus"),
      realtimeSubtitleText: document.getElementById("realtimeSubtitleText"),
      realtimeFinalTranscript: document.getElementById("realtimeFinalTranscript"),
      continueButton: document.getElementById("continueButton"),
      runtimeStatus: document.getElementById("runtimeStatus"),
      runtimeStatusText: document.getElementById("runtimeStatusText"),
      runningStopwatch: document.getElementById("runningStopwatch"),
      elapsedTotal: document.getElementById("elapsedTotal"),
      httpStatus: document.getElementById("httpStatus"),
      sttRuntime: document.getElementById("sttRuntime"),
      verdict: document.getElementById("verdict"),
      sessionId: document.getElementById("sessionId"),
      sessionTokens: document.getElementById("sessionTokens"),
      sessionCost: document.getElementById("sessionCost"),
      turnIndex: document.getElementById("turnIndex"),
      dialogShell: document.getElementById("dialogShell"),
      transcript: document.getElementById("transcript"),
      rawJson: document.getElementById("rawJson")
    };

    const dialogState = {
      terminal: false,
      currentNode: null,
      submittedRequestIds: [],
      submitting: false,
      quickRecording: null,
      quickRecordingFile: null,
      quickRecordingDurationMs: null,
      quickRecordingSampleRate: null,
      quickRecordingTimer: null,
      realtimeWs: null,
      realtimeSession: null,
      realtimeSequence: 0,
      realtimePendingSamples: [],
      realtimePendingSampleCount: 0,
      realtimeTargetSampleRate: 16000,
      realtimeFinalTranscript: null,
      realtimeFinalProvider: null,
      realtimeSubmitting: false,
      selectedChapterId: defaultChapterId
    };

    function makeRequestId(turn) {
      return "req_respond_dialog_" + Date.now() + "_" + turn.session.turn_index;
    }

    function buildDefaultTurn(chapter, node) {
      const sessionId = "session_respond_dialog_" + Date.now();
      return {
        contract_version: "dev_c_unreal_turn.v1",
        request_id: "req_respond_dialog_" + Date.now() + "_1",
        session: {
          session_id: sessionId,
          player_id: "player_001",
          chapter_id: node.chapter_id,
          scene_id: chapter.sceneId,
          current_node_id: node.node_id,
          turn_index: 1
        },
        npc: {
          npc_id: chapter.npcId,
          npc_role: chapter.npcRole,
          last_npc_message: node.npc_question
        },
        audio: {
          mime_type: "audio/wav",
          sample_rate_hz: 16000,
          channels: 1,
          duration_ms: 3000,
          language_hint: "en-US"
        },
        player_profile: {
          nickname: "player",
          english_confidence: "beginner",
          tier: "Bronze",
          travel_speaking_level: "TSL_1_SURVIVAL"
        },
        scenario_state: {
          patience: 100,
          suspicion: 0,
          retry_count: 0,
          hint_count: 0,
          previous_fail_count: 0,
          completed_intents: []
        },
        game_state: {
          inventory: chapter.inventory,
          flags: chapter.flags,
          completed_intents: chapter.completedIntents,
          current_objective: chapter.objective
        },
        previous_node_results: [],
        client_allowed_next_nodes: node.allowed_next_nodes || [],
        client_context: {
          platform: "windows",
          input_device: "microphone",
          locale: "ko-KR",
          build_version: "respond-dialog"
        }
      };
    }

    function updateChapterButtons() {
      refs.chapterButtons.querySelectorAll("[data-chapter-id]").forEach((button) => {
        const isActive = button.dataset.chapterId === dialogState.selectedChapterId;
        button.classList.toggle("active", isActive);
      });
    }

    function setStatus(text, kind) {
      refs.runtimeStatusText.textContent = text;
      refs.runtimeStatus.className = "status-pill" + (kind ? " " + kind : "");
    }

    function formatDuration(ms) {
      if (ms < 1000) {
        return Math.round(ms) + " ms";
      }
      return (ms / 1000).toFixed(2) + " s";
    }

    function setSubmitting(isSubmitting) {
      dialogState.submitting = isSubmitting;
      updateRecordingControls();
    }

    function updateRecordingControls() {
      const isRecording = Boolean(dialogState.quickRecording);
      refs.runButton.disabled = dialogState.submitting || isRecording;
      refs.continueButton.disabled = dialogState.submitting || isRecording;
      refs.quickRecordButton.disabled = dialogState.submitting || isRecording;
      refs.quickStopRecordButton.disabled = dialogState.submitting || !isRecording;
      refs.quickUseRecordingButton.disabled =
        dialogState.submitting || isRecording || !dialogState.quickRecordingFile;
    }

    function setRecordingStatus(text) {
      refs.quickRecordingStatus.textContent = text;
    }

    function setRealtimeSubtitleStatus(text) {
      refs.realtimeSubtitleStatus.textContent = text;
    }

    function setRealtimeSubtitle(text, isFinal) {
      refs.realtimeSubtitleText.textContent = text || "-";
      refs.realtimeSubtitleText.classList.toggle("final", Boolean(isFinal));
      if (isFinal) {
        refs.realtimeFinalTranscript.textContent = "Final transcript: " + (text || "-");
      }
    }

    function resetRealtimeSubtitle() {
      dialogState.realtimeFinalTranscript = null;
      dialogState.realtimeFinalProvider = null;
      dialogState.realtimeSequence = 0;
      dialogState.realtimePendingSamples = [];
      dialogState.realtimePendingSampleCount = 0;
      setRealtimeSubtitleStatus("Idle");
      setRealtimeSubtitle("-", false);
      refs.realtimeFinalTranscript.textContent = "Final transcript: -";
    }

    function clearTiming() {
      refs.elapsedTotal.textContent = "-";
      refs.httpStatus.textContent = "-";
      refs.sttRuntime.textContent = "-";
      refs.verdict.textContent = "-";
    }

    function fillTiming(body, elapsedMs, statusCode) {
      refs.elapsedTotal.textContent = formatDuration(elapsedMs);
      refs.httpStatus.textContent = String(statusCode);
      refs.sttRuntime.textContent = body?.stt?.runtime_used || "-";
      refs.verdict.textContent = body?.evaluation?.verdict || "-";
    }

    function parseTurn() {
      const turn = JSON.parse(refs.turnJson.value);
      if (!turn.request_id) {
        turn.request_id = makeRequestId(turn);
      }
      return turn;
    }

    function writeTurn(turn) {
      refs.turnJson.value = JSON.stringify(turn, null, 2);
      refs.sessionId.textContent = turn.session?.session_id || "-";
      refs.turnIndex.textContent = String(turn.session?.turn_index || "-");
    }

    function resetUsageDisplay() {
      refs.sessionTokens.textContent = "0";
      refs.sessionCost.textContent = "$0.000000";
    }

    function rememberSubmittedRequestId(requestId) {
      if (!requestId || dialogState.submittedRequestIds.includes(requestId)) {
        return;
      }
      dialogState.submittedRequestIds.push(requestId);
    }

    async function startQuickRecording() {
      if (dialogState.quickRecording) {
        return;
      }
      if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== "function") {
        setStatus("Recording Unsupported", "warning");
        setRecordingStatus("Browser microphone recording is unavailable.");
        return;
      }

      const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextCtor) {
        setStatus("Recording Unsupported", "warning");
        setRecordingStatus("Browser audio capture is unavailable.");
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true
          }
        });
        const audioContext = new AudioContextCtor();
        await audioContext.resume();
        const source = audioContext.createMediaStreamSource(stream);
        const processor = audioContext.createScriptProcessor(4096, 1, 1);
        const chunks = [];
        await startRealtimeSttSession(audioContext.sampleRate);

        processor.onaudioprocess = (event) => {
          const input = event.inputBuffer.getChannelData(0);
          chunks.push(new Float32Array(input));
          queueRealtimeSamples(input, audioContext.sampleRate);
          event.outputBuffer.getChannelData(0).fill(0);
        };

        source.connect(processor);
        processor.connect(audioContext.destination);
        dialogState.quickRecording = {
          stream,
          audioContext,
          source,
          processor,
          chunks,
          sampleRate: audioContext.sampleRate,
          startedAt: performance.now()
        };
        dialogState.quickRecordingFile = null;
        dialogState.quickRecordingDurationMs = null;
        dialogState.quickRecordingSampleRate = audioContext.sampleRate;
        setStatus("Recording", "warning");
        setRecordingStatus("Recording 0.0 s");
        updateRecordingControls();
        dialogState.quickRecordingTimer = window.setInterval(updateRecordingTimer, 200);
      } catch (error) {
        setStatus("Mic Blocked", "warning");
        setRecordingStatus(String(error));
        updateRecordingControls();
      }
    }

    function updateRecordingTimer() {
      const recording = dialogState.quickRecording;
      if (!recording) {
        return;
      }
      const elapsedSeconds = (performance.now() - recording.startedAt) / 1000;
      setRecordingStatus("Recording " + elapsedSeconds.toFixed(1) + " s");
    }

    async function stopQuickRecording() {
      const recording = dialogState.quickRecording;
      if (!recording) {
        return;
      }

      if (dialogState.quickRecordingTimer) {
        window.clearInterval(dialogState.quickRecordingTimer);
        dialogState.quickRecordingTimer = null;
      }
      recording.processor.disconnect();
      recording.source.disconnect();
      recording.stream.getTracks().forEach((track) => track.stop());
      recording.audioContext.close().catch(() => {});
      dialogState.quickRecording = null;

      if (!recording.chunks.length) {
        dialogState.quickRecordingFile = null;
        dialogState.quickRecordingDurationMs = null;
        setRecordingStatus("No audio captured.");
        setStatus("Ready", "");
        updateRecordingControls();
        return;
      }

      const durationMs = Math.max(1, Math.round(performance.now() - recording.startedAt));
      const wavBlob = encodeWavRecording(recording.chunks, recording.sampleRate);
      const fileName = "quick-recording-" + new Date().toISOString().replace(/[:.]/g, "-") + ".wav";
      dialogState.quickRecordingFile = new File([wavBlob], fileName, { type: "audio/wav" });
      dialogState.quickRecordingDurationMs = durationMs;
      dialogState.quickRecordingSampleRate = recording.sampleRate;
      refs.quickAudioFile.value = "";
      setRecordingStatus("Recorded " + formatDuration(durationMs) + " as " + fileName);
      setStatus("Ready", "");
      updateRecordingControls();
      await commitRealtimeSttSession(recording);
    }

    function clearQuickRecordingFile() {
      discardActiveRecording();
      closeRealtimeSttSocket(false);
      resetRealtimeSubtitle();
      dialogState.quickRecordingFile = null;
      dialogState.quickRecordingDurationMs = null;
      dialogState.quickRecordingSampleRate = null;
      setRecordingStatus("No recording");
      updateRecordingControls();
    }

    function discardActiveRecording() {
      const recording = dialogState.quickRecording;
      if (!recording) {
        return;
      }
      if (dialogState.quickRecordingTimer) {
        window.clearInterval(dialogState.quickRecordingTimer);
        dialogState.quickRecordingTimer = null;
      }
      recording.processor.disconnect();
      recording.source.disconnect();
      recording.stream.getTracks().forEach((track) => track.stop());
      recording.audioContext.close().catch(() => {});
      dialogState.quickRecording = null;
    }

    async function uploadQuickRecording() {
      if (dialogState.realtimeFinalTranscript) {
        await submitFinalRealtimeTranscript(refs.quickUseRecordingButton);
        return;
      }
      if (!dialogState.quickRecordingFile) {
        setStatus("Record First", "warning");
        return;
      }
      await submitAudio(dialogState.quickRecordingFile, refs.quickUseRecordingButton);
    }

    function realtimeWebSocketUrl() {
      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      return protocol + "//" + window.location.host + "/api/game/ai/stt/stream";
    }

    async function startRealtimeSttSession(sourceSampleRate) {
      closeRealtimeSttSocket(false);
      resetRealtimeSubtitle();

      let turn;
      try {
        turn = parseTurn();
      } catch {
        setRealtimeSubtitleStatus("JSON unavailable");
        return;
      }

      turn.request_id = makeRequestId(turn);
      writeTurn(turn);
      dialogState.realtimeSession = {
        requestId: turn.request_id,
        sessionId: turn.session.session_id,
        turnIndex: Number(turn.session.turn_index || 0),
        chapterId: turn.session.chapter_id,
        sceneId: turn.session.scene_id,
        currentNodeId: turn.session.current_node_id,
        languageHint: turn.audio?.language_hint || "en-US",
        sourceSampleRate
      };

      if (typeof WebSocket !== "function") {
        setRealtimeSubtitleStatus("WebSocket unavailable");
        return;
      }

      setRealtimeSubtitleStatus("Connecting");
      await new Promise((resolve) => {
        const websocket = new WebSocket(realtimeWebSocketUrl());
        let settled = false;
        const settle = () => {
          if (!settled) {
            settled = true;
            resolve();
          }
        };
        dialogState.realtimeWs = websocket;

        websocket.addEventListener("open", () => {
          setRealtimeSubtitleStatus("Streaming");
          websocket.send(JSON.stringify({
            "contract_version": "dev_c_realtime_stt.v1",
            "event_type": "session_start",
            "request_id": dialogState.realtimeSession.requestId,
            "session_id": dialogState.realtimeSession.sessionId,
            "turn_index": dialogState.realtimeSession.turnIndex,
            "sequence": dialogState.realtimeSequence,
            "chapter_id": dialogState.realtimeSession.chapterId,
            "scene_id": dialogState.realtimeSession.sceneId,
            "current_node_id": dialogState.realtimeSession.currentNodeId,
            "provider": "elevenlabs_relay",
            "language_hint": dialogState.realtimeSession.languageHint,
            "sample_rate_hz": dialogState.realtimeTargetSampleRate
          }));
          settle();
        });

        websocket.addEventListener("message", (message) => {
          handleRealtimeSttEvent(message).catch((error) => {
            setRealtimeSubtitleStatus("Submit failed");
            refs.rawJson.textContent = String(error);
          });
        });

        websocket.addEventListener("error", () => {
          setRealtimeSubtitleStatus("WebSocket error");
          settle();
        });

        websocket.addEventListener("close", () => {
          if (dialogState.realtimeWs === websocket) {
            dialogState.realtimeWs = null;
          }
          settle();
        });
      });
    }

    function queueRealtimeSamples(input, sourceSampleRate) {
      if (!isRealtimeSttOpen()) {
        return;
      }

      const copy = new Float32Array(input);
      dialogState.realtimePendingSamples.push(copy);
      dialogState.realtimePendingSampleCount += copy.length;

      const chunkSampleCount = Math.max(1, Math.round(sourceSampleRate * 0.25));
      while (dialogState.realtimePendingSampleCount >= chunkSampleCount) {
        const samples = consumeRealtimePendingSamples(chunkSampleCount);
        sendRealtimeAudioChunk(samples, sourceSampleRate, false);
      }
    }

    async function commitRealtimeSttSession(recording) {
      if (!isRealtimeSttOpen()) {
        return;
      }

      const pendingCount = dialogState.realtimePendingSampleCount;
      let samples = consumeRealtimePendingSamples(pendingCount);
      if (!samples.length && recording.chunks.length) {
        samples = recording.chunks[recording.chunks.length - 1];
      }
      if (!samples.length) {
        samples = new Float32Array([0]);
      }

      sendRealtimeAudioChunk(samples, recording.sampleRate, true);
      setRealtimeSubtitleStatus("Finalizing");
    }

    function consumeRealtimePendingSamples(sampleCount) {
      if (sampleCount <= 0 || !dialogState.realtimePendingSamples.length) {
        return new Float32Array(0);
      }

      const count = Math.min(sampleCount, dialogState.realtimePendingSampleCount);
      const consumed = new Float32Array(count);
      let consumedOffset = 0;

      while (consumedOffset < count && dialogState.realtimePendingSamples.length) {
        const chunk = dialogState.realtimePendingSamples[0];
        const needed = count - consumedOffset;
        if (chunk.length <= needed) {
          consumed.set(chunk, consumedOffset);
          consumedOffset += chunk.length;
          dialogState.realtimePendingSamples.shift();
          dialogState.realtimePendingSampleCount -= chunk.length;
        } else {
          consumed.set(chunk.subarray(0, needed), consumedOffset);
          dialogState.realtimePendingSamples[0] = chunk.subarray(needed);
          consumedOffset += needed;
          dialogState.realtimePendingSampleCount -= needed;
        }
      }

      return consumed;
    }

    function sendRealtimeAudioChunk(samples, sourceSampleRate, commit) {
      if (!isRealtimeSttOpen() || !dialogState.realtimeSession || !samples.length) {
        return;
      }

      dialogState.realtimeSequence += 1;
      const pcm16 = encodePcm16(resampleFloat32(samples, sourceSampleRate, dialogState.realtimeTargetSampleRate));
      dialogState.realtimeWs.send(JSON.stringify({
        "contract_version": "dev_c_realtime_stt.v1",
        "event_type": "audio_chunk",
        "request_id": dialogState.realtimeSession.requestId,
        "session_id": dialogState.realtimeSession.sessionId,
        "turn_index": dialogState.realtimeSession.turnIndex,
        "sequence": dialogState.realtimeSequence,
        "provider": "elevenlabs_relay",
        "audio_base64": arrayBufferToBase64(pcm16.buffer),
        "commit": Boolean(commit),
        "sample_rate_hz": dialogState.realtimeTargetSampleRate,
        "previous_text": dialogState.currentNode?.npc_question || ""
      }));
    }

    async function handleRealtimeSttEvent(message) {
      const event = JSON.parse(message.data);
      if (event.event_type === "session_started") {
        setRealtimeSubtitleStatus("Streaming");
        return;
      }

      if (event.event_type === "partial_transcript" || event.event_type === "final_transcript") {
        const text = event.subtitle?.text || "";
        setRealtimeSubtitle(text, event.event_type === "final_transcript");
        if (event.event_type === "partial_transcript") {
          setRealtimeSubtitleStatus("Listening");
          return;
        }

        dialogState.realtimeFinalTranscript = text;
        dialogState.realtimeFinalProvider = event.provider || "elevenlabs_relay";
        setRealtimeSubtitleStatus(event.provider === "local_batch_fallback" ? "Fallback final" : "Final");
        closeRealtimeSttSocket(false);
        if (event.committed && text) {
          await submitFinalRealtimeTranscript(refs.quickUseRecordingButton);
        }
        return;
      }

      if (event.event_type === "provider_error" || event.event_type === "contract_error") {
        setRealtimeSubtitleStatus("STT error");
        setRealtimeSubtitle(event.error_message || "Realtime STT failed.", false);
        closeRealtimeSttSocket(false);
      }
    }

    function isRealtimeSttOpen() {
      return dialogState.realtimeWs && dialogState.realtimeWs.readyState === WebSocket.OPEN;
    }

    function closeRealtimeSttSocket(sendCancel) {
      const websocket = dialogState.realtimeWs;
      if (!websocket) {
        return;
      }
      if (sendCancel && websocket.readyState === WebSocket.OPEN && dialogState.realtimeSession) {
        dialogState.realtimeSequence += 1;
        websocket.send(JSON.stringify({
          "contract_version": "dev_c_realtime_stt.v1",
          "event_type": "cancel",
          "request_id": dialogState.realtimeSession.requestId,
          "session_id": dialogState.realtimeSession.sessionId,
          "turn_index": dialogState.realtimeSession.turnIndex,
          "sequence": dialogState.realtimeSequence,
          "provider": "elevenlabs_relay"
        }));
      }
      websocket.close();
      dialogState.realtimeWs = null;
    }

    function resampleFloat32(samples, sourceSampleRate, targetSampleRate) {
      if (sourceSampleRate === targetSampleRate) {
        return samples;
      }
      const ratio = sourceSampleRate / targetSampleRate;
      const outputLength = Math.max(1, Math.round(samples.length / ratio));
      const output = new Float32Array(outputLength);

      for (let index = 0; index < outputLength; index += 1) {
        const sourceIndex = index * ratio;
        const before = Math.floor(sourceIndex);
        const after = Math.min(before + 1, samples.length - 1);
        const weight = sourceIndex - before;
        output[index] = samples[before] * (1 - weight) + samples[after] * weight;
      }

      return output;
    }

    function encodePcm16(samples) {
      const pcm = new Int16Array(samples.length);
      for (let index = 0; index < samples.length; index += 1) {
        const sample = Math.max(-1, Math.min(1, samples[index]));
        pcm[index] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
      }
      return pcm;
    }

    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = "";
      for (let index = 0; index < bytes.length; index += 1) {
        binary += String.fromCharCode(bytes[index]);
      }
      return window.btoa(binary);
    }

    function encodeWavRecording(chunks, sampleRate) {
      const samples = mergeFloat32Chunks(chunks);
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);

      writeAscii(view, 0, "RIFF");
      view.setUint32(4, 36 + samples.length * 2, true);
      writeAscii(view, 8, "WAVE");
      writeAscii(view, 12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeAscii(view, 36, "data");
      view.setUint32(40, samples.length * 2, true);

      let offset = 44;
      for (let index = 0; index < samples.length; index += 1) {
        const sample = Math.max(-1, Math.min(1, samples[index]));
        view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
        offset += 2;
      }

      return new Blob([view], { type: "audio/wav" });
    }

    function mergeFloat32Chunks(chunks) {
      const length = chunks.reduce((total, chunk) => total + chunk.length, 0);
      const merged = new Float32Array(length);
      let offset = 0;
      chunks.forEach((chunk) => {
        merged.set(chunk, offset);
        offset += chunk.length;
      });
      return merged;
    }

    function writeAscii(view, offset, text) {
      for (let index = 0; index < text.length; index += 1) {
        view.setUint8(offset + index, text.charCodeAt(index));
      }
    }

    async function loadNode(nodeId) {
      const response = await fetch("/api/game/ai/demo/node/" + encodeURIComponent(nodeId));
      if (!response.ok) {
        throw new Error("Node lookup failed: " + nodeId);
      }
      return response.json();
    }

    async function tryLoadNode(nodeId) {
      try {
        return await loadNode(nodeId);
      } catch {
        return null;
      }
    }

    function applyNodeToTurn(turn, node) {
      turn.session.current_node_id = node.node_id;
      turn.session.chapter_id = node.chapter_id || turn.session.chapter_id;
      turn.client_allowed_next_nodes = node.allowed_next_nodes || [];
      turn.game_state.current_objective = node.npc_question;
      dialogState.currentNode = node;
    }

    function appendMessage(role, speaker, text, audioUrl) {
      const item = document.createElement("article");
      item.className = "message " + role;

      const speakerNode = document.createElement("div");
      speakerNode.className = "speaker";
      speakerNode.textContent = speaker;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text || "-";

      item.append(speakerNode, bubble);

      if (audioUrl) {
        const play = document.createElement("button");
        play.className = "play";
        play.type = "button";
        play.textContent = "Play";
        play.addEventListener("click", () => {
          const audio = new Audio(audioUrl);
          audio.play();
        });
        item.appendChild(play);
      }

      refs.transcript.appendChild(item);
      refs.dialogShell.scrollTop = refs.dialogShell.scrollHeight;
    }

    function appendDivider(responseBody) {
      const item = document.createElement("div");
      item.className = "turn-divider";

      const label = document.createElement("div");
      label.className = "divider-label";

      const marks = document.createElement("strong");
      marks.textContent = "---";

      const detail = document.createElement("span");
      const verdict = responseBody.evaluation?.verdict || "-";
      detail.textContent = [
        responseBody.current_node_id + " -> " + responseBody.next_node_id,
        responseBody.next_action || "-",
        verdict
      ].join(" | ");

      label.append(marks, detail);
      item.appendChild(label);
      refs.transcript.appendChild(item);
      refs.dialogShell.scrollTop = refs.dialogShell.scrollHeight;
    }

    function resetTranscript(initialText, speaker) {
      refs.transcript.innerHTML = "";
      appendMessage("npc", speaker || "NPC", initialText, null);
    }

    function applyStateDelta(turn, delta) {
      if (!delta) {
        return;
      }
      const state = turn.scenario_state;
      state.patience += Number(delta.patience_delta || 0);
      state.suspicion += Number(delta.suspicion_delta || 0);
      state.retry_count += Number(delta.retry_count_delta || 0);
      state.hint_count += Number(delta.hint_count_delta || 0);
      state.previous_fail_count = state.retry_count;
    }

    function appendPreviousNodeResult(turn, responseBody) {
      turn.previous_node_results.push({
        node_id: responseBody.current_node_id,
        verdict: responseBody.evaluation?.verdict || "UNKNOWN",
        next_action: responseBody.next_action || "UNKNOWN",
        feedback_tags: responseBody.evaluation?.feedback_tags || []
      });
    }

    async function updateNextTurn(turn, responseBody) {
      applyStateDelta(turn, responseBody.state_delta);
      appendPreviousNodeResult(turn, responseBody);

      turn.session.turn_index = Number(turn.session.turn_index || 0) + 1;
      turn.request_id = makeRequestId(turn);
      turn.npc.last_npc_message = responseBody.npc?.text || turn.npc.last_npc_message;
      delete turn.audio.transcript;

      const action = responseBody.next_action;
      const nextNodeId = responseBody.next_node_id;
      if (
        action === "ADVANCE"
        && nextNodeId
        && (
          nextNodeId.startsWith("FLIGHT_")
          || nextNodeId.startsWith("IMM_")
          || nextNodeId.startsWith("BAG_")
        )
      ) {
        const nextNode = await tryLoadNode(nextNodeId);
        if (nextNode) {
          applyNodeToTurn(turn, nextNode);
          writeTurn(turn);
          return;
        }
      }

      if (action === "REASK" || action === "GIVE_HINT") {
        const currentNode = await tryLoadNode(responseBody.current_node_id);
        if (currentNode) {
          applyNodeToTurn(turn, currentNode);
        } else {
          turn.session.current_node_id = responseBody.current_node_id;
        }
        writeTurn(turn);
        return;
      }

      dialogState.terminal = true;
      writeTurn(turn);
      setStatus("Terminal", action === "FAIL_END" ? "error" : "warning");
    }

    async function updateUsage(sessionId) {
      const params = new URLSearchParams();
      params.set("session_id", sessionId);
      dialogState.submittedRequestIds.forEach((requestId) => {
        params.append("request_ids", requestId);
      });
      const response = await fetch("/api/game/ai/agent-runs/session-usage?" + params.toString());
      if (!response.ok) {
        return;
      }
      const body = await response.json();
      const usage = body.sessions && body.sessions[0];
      refs.sessionTokens.textContent = usage ? String(usage.total_tokens) : "0";
      refs.sessionCost.textContent = usage
        ? "$" + Number(usage.estimated_cost_usd).toFixed(6)
        : "$0.000000";
    }

    async function resetDialog() {
      await startChapter(dialogState.selectedChapterId || defaultChapterId);
    }

    async function startChapter(chapterId) {
      const chapter = chapterStarts[chapterId] || chapterStarts[defaultChapterId];
      dialogState.selectedChapterId = Object.prototype.hasOwnProperty.call(chapterStarts, chapterId)
        ? chapterId
        : defaultChapterId;
      dialogState.terminal = false;
      dialogState.submittedRequestIds = [];
      refs.rawJson.textContent = "-";
      clearTiming();
      clearQuickRecordingFile();
      const node = await loadNode(chapter.nodeId);
      const turn = buildDefaultTurn(chapter, node);
      applyNodeToTurn(turn, node);
      turn.npc.last_npc_message = node.npc_question;
      writeTurn(turn);
      resetTranscript(node.npc_question, chapter.speaker);
      updateChapterButtons();
      resetUsageDisplay();
      setStatus("Idle", "");
    }

    async function runRequest() {
      const audio = refs.audioFile.files[0];
      if (!audio) {
        setStatus("Select WAV", "warning");
        return;
      }

      await submitAudio(audio, refs.runButton);
    }

    async function continueWithAudio() {
      const audio = refs.quickAudioFile.files[0];
      if (!audio) {
        setStatus("Select WAV", "warning");
        return;
      }

      await submitAudio(audio, refs.continueButton);
    }

    async function submitFinalRealtimeTranscript(activeButton) {
      const finalTranscript = (dialogState.realtimeFinalTranscript || "").trim();
      if (!finalTranscript || dialogState.realtimeSubmitting) {
        return;
      }
      if (dialogState.terminal) {
        setStatus("Reset Required", "warning");
        return;
      }

      let turn;
      try {
        turn = parseTurn();
      } catch (error) {
        setStatus("Invalid JSON", "error");
        refs.rawJson.textContent = String(error);
        return;
      }

      dialogState.realtimeSubmitting = true;
      turn.request_id = dialogState.realtimeSession?.requestId || makeRequestId(turn);
      turn.audio.mime_type = "audio/wav";
      turn.audio.channels = 1;
      turn.audio.sample_rate_hz = dialogState.realtimeTargetSampleRate;
      turn.audio.duration_ms = dialogState.quickRecordingDurationMs || turn.audio.duration_ms;
      turn.audio.transcript = finalTranscript;
      writeTurn(turn);

      setSubmitting(true);
      setStatus("Running", "running");
      const started = performance.now();
      try {
        const response = await fetch("/api/game/ai/respond", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            turn,
            audio: {
              transcript: finalTranscript,
              "transcript_provider": dialogState.realtimeFinalProvider || "elevenlabs_relay",
              file_name: "realtime-final-transcript.txt",
              content_type: "text/plain"
            }
          })
        });
        await handleRespondResponse(turn, response, started, activeButton);
      } catch (error) {
        refs.elapsedTotal.textContent = "-";
        refs.httpStatus.textContent = "-";
        setStatus("Failed", "error");
        refs.rawJson.textContent = String(error);
      } finally {
        dialogState.realtimeSubmitting = false;
        setSubmitting(false);
      }
    }

    async function submitAudio(audio, activeButton) {
      if (dialogState.terminal) {
        setStatus("Reset Required", "warning");
        return;
      }

      let turn;
      try {
        turn = parseTurn();
      } catch (error) {
        setStatus("Invalid JSON", "error");
        refs.rawJson.textContent = String(error);
        return;
      }

      turn.request_id = makeRequestId(turn);
      if (audio === dialogState.quickRecordingFile) {
        turn.audio.mime_type = "audio/wav";
        turn.audio.channels = 1;
        turn.audio.duration_ms = dialogState.quickRecordingDurationMs || turn.audio.duration_ms;
        turn.audio.sample_rate_hz = dialogState.quickRecordingSampleRate || turn.audio.sample_rate_hz;
      }
      delete turn.audio.transcript;
      writeTurn(turn);

      const form = new FormData();
      form.append("turn", new Blob([JSON.stringify(turn)], { type: "application/json" }), "turn.json");
      form.append("audio", audio, audio.name);

      setSubmitting(true);
      setStatus("Running", "running");
      const started = performance.now();
      try {
        const response = await fetch("/api/game/ai/respond", {
          method: "POST",
          body: form
        });
        await handleRespondResponse(turn, response, started, activeButton);
      } catch (error) {
        refs.elapsedTotal.textContent = "-";
        refs.httpStatus.textContent = "-";
        setStatus("Failed", "error");
        refs.rawJson.textContent = String(error);
      } finally {
        setSubmitting(false);
      }
    }

    async function handleRespondResponse(turn, response, started, activeButton) {
      const elapsedMs = performance.now() - started;
      const text = await response.text();
      const body = JSON.parse(text);
      fillTiming(body, elapsedMs, response.status);
      refs.rawJson.textContent = JSON.stringify(body, null, 2);

      if (!response.ok) {
        setStatus("Failed", "error");
        return;
      }

      appendMessage("user", "You", body.stt?.player_text || "-");
      appendMessage("npc", body.npc?.speaker || "Officer Miller", body.npc?.text || "-", body.npc?.audio_url);
      appendDivider(body);
      rememberSubmittedRequestId(body.request_id || turn.request_id);
      await updateUsage(body.session_id || turn.session.session_id);
      await updateNextTurn(turn, body);
      if (activeButton === refs.continueButton) {
        refs.quickAudioFile.value = "";
      }
      if (activeButton === refs.quickUseRecordingButton) {
        dialogState.quickRecordingFile = null;
        dialogState.quickRecordingDurationMs = null;
        dialogState.quickRecordingSampleRate = null;
        refs.quickAudioFile.value = "";
        setRecordingStatus("Realtime transcript submitted.");
      }
      if (!dialogState.terminal) {
        setStatus("Ready", "");
      }
      updateRecordingControls();
    }

    refs.chapterButtons.querySelectorAll("[data-chapter-id]").forEach((button) => {
      button.addEventListener("click", () => {
        startChapter(button.dataset.chapterId).catch((error) => {
          setStatus("Chapter Failed", "error");
          refs.rawJson.textContent = String(error);
        });
      });
    });
    refs.resetTurn.addEventListener("click", resetDialog);
    refs.runButton.addEventListener("click", runRequest);
    refs.continueButton.addEventListener("click", continueWithAudio);
    refs.quickRecordButton.addEventListener("click", startQuickRecording);
    refs.quickStopRecordButton.addEventListener("click", stopQuickRecording);
    refs.quickUseRecordingButton.addEventListener("click", uploadQuickRecording);
    resetDialog().catch((error) => {
      setStatus("Init Failed", "error");
      refs.rawJson.textContent = String(error);
    });
  </script>
</body>
</html>
