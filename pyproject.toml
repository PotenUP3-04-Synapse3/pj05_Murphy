[project]
name = "pj05-murphy"
version = "0.1.0"
description = "Developer C AI backend harness for Murphy's Trippin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "espeakng-loader>=0.2.4",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "kokoro>=0.9.4",
    "langchain==1.3.2",
    "langgraph==1.2.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.30",
    "soundfile>=0.13.1",
    "torch>=2.12.0",
    "uvicorn[standard]>=0.48.0",
]

[project.optional-dependencies]
local-stt = [
    "openai-whisper>=20240930",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
pythonpath = ["."]
