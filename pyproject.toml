[project]
name = "pj05-murphy"
version = "0.1.0"
description = "Developer C AI backend harness for Murphy's Trippin"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "edge-tts>=7.2.8",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "langchain==1.3.2",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph==1.2.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.30",
    "soundfile>=0.13.1",
    "uvicorn[standard]>=0.48.0",
    "websockets>=16.0",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
local-stt = [
    "openai-whisper>=20240930",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = ["backend/runtime/generated"]

[tool.ruff]
exclude = [
    ".tmp",
    ".venv",
    ".git",
    "__pycache__",
]

[tool.mypy]
exclude = [
    "^backend/runtime/generated/",
]

